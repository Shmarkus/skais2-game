name: Gherkin Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  gherkin-tests:
    runs-on: ubuntu-latest
    continue-on-error: true # pending scenarios expected until reducer is done

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Run Gherkin features
        run: npx cucumber-js --format json:test-results/cucumber.json --format summary

      - name: Convert to JUnit XML
        if: always()
        run: node scripts/cucumber-to-junit.js

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gherkin-test-results
          path: test-results/gherkin.xml
          retention-days: 7
